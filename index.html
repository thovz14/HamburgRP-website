<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperMC Server</title>
    <meta name="description" content="PaperMC Server Official Website">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>


    <nav class="top-nav">
        <a href="index.html" class="nav-link active">Home</a>
        <a href="updates.html" class="nav-link">Updates</a>
        <a href="admin.html" class="nav-link">Admin</a>
    </nav>

    <main class="container">
        <section class="hero-bar">
            <div class="widget copyable" data-copy="PLAY.PAPERSMP.NET" data-type="ip">
                <div class="widget-icon">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <div class="widget-text">
                    <h2>PLAY.PAPERSMP.NET</h2>
                    <p id="player-count">1 players online</p>
                </div>
                <div class="tooltip ip-tooltip">COPIED!</div>
            </div>

            <div class="hero-logo">
                <img src="Media/Icons/logo.png" alt="Server Logo" class="logo">
            </div>

            <div class="widget copyable" data-copy="https://discord.gg/ZbnKDTS7kx" data-type="discord">
                <div class="widget-icon discord-icon">
                    <i class="fa-brands fa-discord"></i>
                </div>
                <div class="widget-text">
                    <h2>JOIN OUR DISCORD</h2>
                    <p>7 members in the discord</p>
                </div>
                <div class="tooltip discord-tooltip">LINK COPIED!</div>
            </div>
        </section>

        <section class="owners">
            <div class="owner-card">
                <div class="avatar-wrapper">
                    <img src="https://minotar.net/helm/Thomasvz14/100.png" alt="Thomasvz14" class="owner-avatar">
                    <div class="status-indicator offline" id="status-thomasvz14" title="Checking status..."></div>
                </div>
                <div class="owner-info">
                    <h3>Thomasvz14</h3>
                    <span class="badge owner-badge">OWNER</span>
                </div>
            </div>

            <div class="owner-card">
                <div class="avatar-wrapper">
                    <img src="https://minotar.net/helm/milanotje1/100.png" alt="milanotje1" class="owner-avatar">
                    <div class="status-indicator offline" id="status-milanotje1" title="Checking status..."></div>
                </div>
                <div class="owner-info">
                    <h3>milanotje1</h3>
                    <span class="badge co-owner-badge">CO-OWNER</span>
                </div>
            </div>
        </section>
    </main>

    <!-- Player Modal -->
    <div id="player-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-btn"><i class="fa-solid fa-times"></i></button>
            <div class="modal-body">
                <div class="modal-skin">
                    <img src="" id="modal-skin" alt="Player Skin">
                </div>
                <div class="modal-info">
                    <h2 id="modal-name">Name</h2>
                    <span id="modal-rank" class="badge">RANK</span>
                    <div id="modal-status" class="modal-status-row">
                        <div class="status-dot offline"></div>
                        <span>Checking...</span>
                    </div>
                    <div class="modal-details">
                        <div class="detail-row">
                            <span class="detail-label">UUID</span>
                            <span class="detail-value" id="modal-uuid">Loading...</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Skin Model</span>
                            <span class="detail-value" id="modal-model">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        Ontworpen door <a href="https://accounts.wonderdev.nl" target="_blank">wonderlight studios</a>
    </footer>

    <script type="module" src="script.js"></script>
</body>

</html>
